[project]
name = "hybrid-example"
version = "0.1.0"
entry = "app.zvelte"

[app]
target = "web"
mode = "hybrid"
renderer = "js"
strict = true

[toolchain]
zig = "0.17.1"
python = "3.15"

[python]
enabled = true
executable = "python3"
execution = "server"
zig_acceleration = true

[zig]
enabled = true
executable = "zig"
native_modules = true
wasm_modules = true

[dev]
host = "127.0.0.1"
port = 3003
hot_reload = true
open_browser = false

[build]
output = "dist"
cache = ".zvelte"
optimization = "debug"
minify = false
source_maps = true
