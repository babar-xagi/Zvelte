[project]
name = "todo-example"
version = "0.1.0"
entry = "app.zvelte"

[app]
target = "web"
mode = "python"
renderer = "js"
strict = true

[python]
enabled = false
executable = "python3"
version = "3.10+"

[dev]
host = "127.0.0.1"
port = 3002
hot_reload = true
open_browser = false

[build]
output = "dist"
cache = ".zvelte"
optimization = "release"
minify = false
source_maps = true
