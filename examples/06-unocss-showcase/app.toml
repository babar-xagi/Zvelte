[project]
name = "unocss-showcase"
version = "0.1.0"
entry = "app.zvelte"

[app]
target = "web"
mode = "python"
renderer = "js"
strict = true

[python]
enabled = true
executable = "python3"
version = "3.10+"

[unocss]
enabled = true
preflight = true
attributify = true
variant_group = true
dark_mode = "class"
preset = "uno"
mode = "auto"

[unocss.shortcuts]
pill = "px-3 py-1 rounded-full text-xs font-semibold tracking-wide transition"
uno-card = "bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl"
uno-btn = "pill px-4 py-2 cursor-pointer hover:(opacity-90 -translate-y-0.5)"
uno-btn-primary = "uno-btn bg-sky-500 text-white hover:bg-sky-400"

[dev]
host = "127.0.0.1"
port = 3006
hot_reload = true

[build]
output = "dist"
cache = ".zvelte"
